<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fuel Cost Calculator — Trip & Monthly Costs | Tabutility</title>
  <meta name="description" content="Calculate fuel costs for a trip or monthly driving. Works in miles/km and MPG/L per 100km. Compare petrol, diesel and electric costs." />
  <meta name="keywords" content="fuel cost calculator, petrol cost, gas cost calculator, trip fuel calculator, mpg calculator, cost per mile" />
  <link rel="canonical" href="https://fuel-cost.tabutility.com/" />
  <meta property="og:title" content="Fuel Cost Calculator" />
  <meta property="og:description" content="Calculate trip and monthly fuel costs in miles or km, MPG or L/100km." />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛽</text></svg>" />
  <meta name="robots" content="index, follow" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7039091592734005" crossorigin="anonymous"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-78VZWJ5B1W"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-78VZWJ5B1W');</script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin:0;background:#f8faff;font-family:'Segoe UI',Arial,sans-serif">
<div id="root"></div>
<script type="text/babel">
//<![CDATA[
const { useState } = React;
function fmtC(n,sym='$'){return sym+n.toFixed(2);}

function App() {
  const [unit, setUnit] = useState('imperial'); // imperial = miles + MPG; metric = km + L/100km
  const [distance, setDistance] = useState(150);
  const [efficiency, setEfficiency] = useState(30); // MPG or L/100km
  const [fuelPrice, setFuelPrice] = useState(3.50);
  const [currency, setCurrency] = useState('$');
  const [tab, setTab] = useState('trip');
  const [monthlyMiles, setMonthlyMiles] = useState(1000);

  const sym = currency;

  // Litres used
  let litres;
  if (unit === 'imperial') {
    // MPG — 1 gallon = 3.78541 L; distance in miles
    litres = (Number(distance) / Number(efficiency)) * 3.78541;
  } else {
    // L/100km
    litres = Number(distance) / 100 * Number(efficiency);
  }
  const tripCost = litres * Number(fuelPrice);
  const distLabel = unit === 'imperial' ? 'miles' : 'km';
  const effLabel = unit === 'imperial' ? 'MPG' : 'L/100km';
  const priceLabel = unit === 'imperial' ? `${sym}/gallon` : `${sym}/litre`;

  let monthlyLitres;
  if (unit === 'imperial') monthlyLitres = (Number(monthlyMiles) / Number(efficiency)) * 3.78541;
  else monthlyLitres = Number(monthlyMiles) / 100 * Number(efficiency);
  const monthlyCost = monthlyLitres * Number(fuelPrice);
  const yearlyCost = monthlyCost * 12;
  const costPerMile = tripCost / Number(distance);

  return (
    <div style={{maxWidth:520,margin:'0 auto',paddingBottom:40}}>
      <div style={{background:'#1a1a2e',padding:'12px 20px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <a href="https://tabutility.com" style={{color:'#a5b4fc',textDecoration:'none',fontSize:14}}>← All Tools</a>
        <span style={{color:'#fff',fontWeight:700,fontSize:15}}>⚡ Tabutility</span>
      </div>
      <div style={{background:'linear-gradient(135deg,#ea580c,#c2410c)',padding:'28px 20px',textAlign:'center',color:'#fff'}}>
        <div style={{fontSize:36,marginBottom:8}}>⛽</div>
        <h1 style={{margin:'0 0 6px',fontSize:22,fontWeight:900}}>Fuel Cost Calculator</h1>
        <p style={{margin:0,fontSize:13,opacity:0.85}}>Trip costs · monthly spend · cost per mile</p>
      </div>
      <div style={{padding:20}}>
        <div style={{display:'flex',gap:8,marginBottom:16}}>
          {[['trip','Trip Cost'],['monthly','Monthly Cost']].map(([t,l])=>(
            <button key={t} onClick={()=>setTab(t)} style={{flex:1,padding:'10px',borderRadius:10,border:`2px solid ${tab===t?'#ea580c':'#e5e7eb'}`,background:tab===t?'#ea580c':'#fff',color:tab===t?'#fff':'#374151',fontWeight:600,cursor:'pointer',fontSize:14}}>{l}</button>
          ))}
        </div>

        <div style={{background:'#fff',borderRadius:14,padding:20,boxShadow:'0 2px 12px rgba(0,0,0,0.06)',marginBottom:16}}>
          <div style={{display:'flex',gap:8,marginBottom:14}}>
            {[['imperial','🇺🇸 Miles / MPG'],['metric','🇪🇺 Km / L per 100km']].map(([u,l])=>(
              <button key={u} onClick={()=>setUnit(u)} style={{flex:1,padding:'8px',borderRadius:8,border:`2px solid ${unit===u?'#ea580c':'#e5e7eb'}`,background:unit===u?'#fff5f0':'#fff',color:unit===u?'#ea580c':'#374151',fontWeight:600,cursor:'pointer',fontSize:13}}>{l}</button>
            ))}
          </div>

          {tab === 'trip' ? (
            <div>
              <div style={{marginBottom:12}}>
                <label style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',marginBottom:5}}>Distance ({distLabel})</label>
                <input type="number" value={distance} onChange={e=>setDistance(e.target.value)}
                  style={{width:'100%',padding:'10px 12px',borderRadius:10,border:'2px solid #e5e7eb',fontSize:16,boxSizing:'border-box'}} />
              </div>
            </div>
          ) : (
            <div style={{marginBottom:12}}>
              <label style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',marginBottom:5}}>Monthly Distance ({distLabel})</label>
              <input type="number" value={monthlyMiles} onChange={e=>setMonthlyMiles(e.target.value)}
                style={{width:'100%',padding:'10px 12px',borderRadius:10,border:'2px solid #e5e7eb',fontSize:16,boxSizing:'border-box'}} />
            </div>
          )}

          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            <div>
              <label style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',marginBottom:5}}>Fuel Economy ({effLabel})</label>
              <input type="number" value={efficiency} onChange={e=>setEfficiency(e.target.value)}
                style={{width:'100%',padding:'10px 12px',borderRadius:10,border:'2px solid #e5e7eb',fontSize:15,boxSizing:'border-box'}} />
            </div>
            <div>
              <label style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',marginBottom:5}}>Fuel Price ({priceLabel})</label>
              <div style={{position:'relative'}}>
                <span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'#9ca3af'}}>{sym}</span>
                <input type="number" value={fuelPrice} onChange={e=>setFuelPrice(e.target.value)} step="0.01"
                  style={{width:'100%',padding:'10px 10px 10px 24px',borderRadius:10,border:'2px solid #e5e7eb',fontSize:15,boxSizing:'border-box'}} />
              </div>
            </div>
          </div>
          <div style={{marginTop:12}}>
            <label style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',marginBottom:5}}>Currency</label>
            <select value={currency} onChange={e=>setCurrency(e.target.value)}
              style={{width:'100%',padding:'10px',borderRadius:10,border:'2px solid #e5e7eb',fontSize:15,background:'#fff'}}>
              {[['$','USD ($)'],['£','GBP (£)'],['€','EUR (€)'],['A$','AUD (A$)'],['C$','CAD (C$)']].map(([v,l])=><option key={v} value={v}>{l}</option>)}
            </select>
          </div>
        </div>

        <div style={{background:'linear-gradient(135deg,#fff5f0,#ffedd5)',borderRadius:14,padding:24,textAlign:'center',marginBottom:16}}>
          <div style={{fontSize:13,fontWeight:700,color:'#9a3412'}}>
            {tab === 'trip' ? 'TRIP FUEL COST' : 'MONTHLY FUEL COST'}
          </div>
          <div style={{fontSize:52,fontWeight:900,color:'#ea580c',margin:'6px 0'}}>
            {fmtC(tab==='trip'?tripCost:monthlyCost,sym)}
          </div>
          {tab === 'monthly' && <div style={{fontSize:14,color:'#c2410c',fontWeight:600}}>{fmtC(yearlyCost,sym)} / year</div>}
        </div>

        <div style={{background:'#fff',borderRadius:14,padding:20,boxShadow:'0 2px 12px rgba(0,0,0,0.06)'}}>
          {(tab==='trip'?[
            ['Distance', `${Number(distance).toLocaleString()} ${distLabel}`],
            ['Fuel Used', `${litres.toFixed(1)} litres`],
            ['Cost Per '+distLabel.slice(0,-1), fmtC(costPerMile,sym)],
            ['Fuel Economy', `${efficiency} ${effLabel}`],
            ['Fuel Price', fmtC(Number(fuelPrice),sym)+' per '+(unit==='imperial'?'gallon':'litre')],
          ]:[
            ['Monthly Distance', `${Number(monthlyMiles).toLocaleString()} ${distLabel}`],
            ['Monthly Fuel Used', `${monthlyLitres.toFixed(0)} litres`],
            ['Monthly Cost', fmtC(monthlyCost,sym)],
            ['Annual Cost', fmtC(yearlyCost,sym)],
            ['Weekly Cost', fmtC(monthlyCost/4.33,sym)],
          ]).map(([l,v])=>(
            <div key={l} style={{display:'flex',justifyContent:'space-between',padding:'9px 0',borderBottom:'1px solid #f0f0f0',fontSize:14}}>
              <span style={{color:'#6b7280'}}>{l}</span><strong>{v}</strong>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
//]]>
</script>
</body>
</html>
